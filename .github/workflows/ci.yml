name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { task: build, command: bun run build }
          - { task: fmt, command: bun fmt --check }
          - { task: lint, command: bun lint }
          - { task: test, command: bun run test }
          - { task: typecheck, command: bun run typecheck }

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: ${{ matrix.command }}
      - if: matrix.task == 'build'
        run: |
          cd packages/bippy
          bun scripts/check-built.ts
          bun run bench:smoke
