name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        task: [build, check, test, typecheck]

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - uses: actions/cache@v4
        with:
          path: packages/bippy-analyzer/src/react-compiler
          key: react-compiler-${{ hashFiles('packages/bippy-analyzer/patches/react-compiler.patch') }}
      - run: pnpm install --frozen-lockfile
      - if: matrix.task == 'test'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - if: matrix.task == 'test'
        run: pnpm --filter bippy-analyzer exec playwright install --with-deps chromium
      - run: pnpm run ${{ matrix.task }}
      - if: matrix.task == 'build'
        run: |
          pnpm --filter bippy exec tsx scripts/check-built.ts
          pnpm --filter bippy bench:smoke
