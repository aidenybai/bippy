name: React Canary

# Runs the ported ReactFresh suite against the latest React experimental
# nightlies (built from facebook/react main). Failures here mean upstream
# internals changed in a way that will eventually break bippy on stable —
# months of warning instead of a release-day surprise.
on:
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Update to the latest experimental nightlies
        run: bun run --filter @bippy/e2e-refresh-experimental update-experimental
      - name: Report nightly versions
        run: bun -e "const pkg = require('./packages/bippy/tests/fixtures/refresh-app-experimental/package.json'); console.log(JSON.stringify(pkg.dependencies, null, 2))"
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
        working-directory: packages/bippy/tests/e2e
      - name: Run refresh suite against the nightlies
        run: bunx playwright test --project=refresh-experimental
        working-directory: packages/bippy/tests/e2e
        env:
          # Only the experimental fixture's dev server is needed; without
          # this, playwright would boot every configured webServer.
          BIPPY_E2E_SERVERS: refresh-experimental
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: react-canary-report
          path: packages/bippy/tests/e2e/playwright-report/
          retention-days: 14
