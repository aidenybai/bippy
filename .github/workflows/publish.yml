name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - uses: actions/setup-node@v6
        with:
          node-version: 22.18.0

      - run: npm install -g npm@11

      - run: bun install --frozen-lockfile

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: bun run release
          version: bun run version
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

  publish-dev:
    name: Publish @dev snapshot
    needs: publish
    if: ${{ !cancelled() && needs.publish.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@11

      - run: bun install --frozen-lockfile

      - name: Compute dev version
        id: dev-version
        run: |
          base_version="$(cd packages/bippy && bun pm pkg get version | tr -d '"')"
          dev_version="${base_version}-dev.$(git rev-parse --short HEAD)"
          echo "version=${dev_version}" >> "$GITHUB_OUTPUT"
          echo "Publishing dev snapshot ${dev_version}"

      - name: Apply dev version to published package
        env:
          DEV_VERSION: ${{ steps.dev-version.outputs.version }}
        working-directory: packages/bippy
        run: bun pm pkg set version="$DEV_VERSION"

      - name: Publish to npm under the dev tag
        env:
          DEV_VERSION: ${{ steps.dev-version.outputs.version }}
          NPM_CONFIG_PROVENANCE: true
        working-directory: packages/bippy
        run: |
          for attempt in 1 2 3; do
            if npm view "bippy@${DEV_VERSION}" version > /dev/null 2>&1 || npm publish --tag dev --access public; then
              exit 0
            fi
            backoff_seconds=$((attempt * 15))
            echo "Dev publish attempt ${attempt} failed; retrying in ${backoff_seconds}s"
            sleep "${backoff_seconds}"
          done
          echo "Dev publish failed after 3 attempts"
          exit 1
